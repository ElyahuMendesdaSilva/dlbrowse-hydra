[package]
name = "dlbrowse-hydra"
version = "0.1.0"
edition = "2021"
description = "Navegador leve de fontes JSON do Hydra para o terminal, feito para computadores fracos"
keywords = ["tui", "json", "hydra", "ratatui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
anyhow = "1"
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true